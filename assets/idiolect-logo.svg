<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Idiolect logo</title>
  <desc id="desc">A neural network shaped like a listening ear above the words Idiolect, your personal speech model.</desc>
  <defs>
    <linearGradient id="brandGradient" x1="250" y1="0" x2="950" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#175941"/>
      <stop offset=".48" stop-color="#667b2f"/>
      <stop offset="1" stop-color="#c58717"/>
    </linearGradient>
    <style>
      .network {
        fill: none;
        stroke: url(#brandGradient);
        stroke-width: 11;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ear {
        fill: none;
        stroke: url(#brandGradient);
        stroke-width: 13;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .node { fill: url(#brandGradient); }
      .wordmark {
        fill: #07160e;
        font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
        font-size: 206px;
        font-weight: 400;
        letter-spacing: -12px;
      }
      .tagline {
        fill: #74766b;
        font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
        font-size: 43px;
        font-weight: 400;
        letter-spacing: 2px;
      }
    </style>
  </defs>

